<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sergio Jiménez del Ojo</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg), #111827);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      .card {
        width: min(90vw, 760px);
        background: rgba(22, 27, 34, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 2rem 2.5rem;
        box-shadow: 0 16px 40px rgba(0,0,0,0.3);
        text-align: center;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 5vw, 3.5rem);
      }
      p {
        margin: 0;
        line-height: 1.7;
        color: var(--muted);
        font-size: 1.08rem;
      }
      .badge {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.35rem 0.8rem;
        border-radius: 999px;
        background: rgba(88, 166, 255, 0.12);
        color: var(--accent);
        border: 1px solid rgba(88, 166, 255, 0.2);
        font-weight: bold;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">GitHub Pages</div>
      <h1>Sergio Jiménez del Ojo</h1>
      <p>
        La web ya está publicada correctamente desde este repositorio.
        Si habías cambiado el nombre del repositorio y las páginas dejaron de cargar,
        este archivo en la raíz corrige la entrada principal de GitHub Pages.
      </p>
    </main>
  </body>
</html>
